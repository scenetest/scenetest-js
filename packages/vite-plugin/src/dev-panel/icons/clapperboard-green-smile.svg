<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main board body -->
  <rect x="2" y="8" width="20" height="14" rx="2.5" stroke="#22c55e" stroke-width="1.5" fill="white"/>

  <!-- Top clapper (closed flat) -->
  <rect x="2" y="4" width="20" height="5" rx="1.5" stroke="#22c55e" stroke-width="1.5" fill="white"/>

  <!-- Stripes on clapper -->
  <line x1="8" y1="4" x2="8" y2="9" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="4" x2="14" y2="9" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cute crooked smile -->
  <path d="M8 14.5 Q12 18 16 14" stroke="#22c55e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
