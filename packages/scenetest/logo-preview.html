<!DOCTYPE html>
<html>
<head>
  <title>Scenetest Logo Options</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .row {
      display: flex;
      gap: 40px;
      align-items: center;
    }
    .logo-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .logo-box span {
      font-size: 14px;
      color: #666;
    }
    .preview {
      display: flex;
      gap: 20px;
      padding: 20px;
      border-radius: 8px;
    }
    .light { background: #f5f5f5; }
    .dark { background: #1a1a1a; color: white; }
    h2 { margin: 0 0 20px 0; }
    .sizes {
      display: flex;
      gap: 20px;
      align-items: end;
    }
  </style>
</head>
<body>
  <h1>Scenetest Logo Options</h1>

  <div>
    <h2>1. Simple (recommended)</h2>
    <div class="row">
      <div class="preview light">
        <img src="logo-simple.svg" width="64" height="64">
      </div>
      <div class="preview dark">
        <img src="logo-simple.svg" width="64" height="64" style="filter: invert(1)">
      </div>
      <div class="sizes">
        <img src="logo-simple.svg" width="16" height="16">
        <img src="logo-simple.svg" width="24" height="24">
        <img src="logo-simple.svg" width="32" height="32">
        <img src="logo-simple.svg" width="48" height="48">
        <img src="logo-simple.svg" width="64" height="64">
      </div>
    </div>
  </div>

  <div>
    <h2>2. Modern (open clapper)</h2>
    <div class="row">
      <div class="preview light">
        <img src="logo-modern.svg" width="64" height="64">
      </div>
      <div class="preview dark">
        <img src="logo-modern.svg" width="64" height="64" style="filter: invert(1)">
      </div>
      <div class="sizes">
        <img src="logo-modern.svg" width="16" height="16">
        <img src="logo-modern.svg" width="24" height="24">
        <img src="logo-modern.svg" width="32" height="32">
        <img src="logo-modern.svg" width="48" height="48">
        <img src="logo-modern.svg" width="64" height="64">
      </div>
    </div>
  </div>

  <div>
    <h2>3. Outlined</h2>
    <div class="row">
      <div class="preview light">
        <img src="logo-outlined.svg" width="64" height="64">
      </div>
      <div class="preview dark">
        <img src="logo-outlined.svg" width="64" height="64" style="filter: invert(1)">
      </div>
      <div class="sizes">
        <img src="logo-outlined.svg" width="16" height="16">
        <img src="logo-outlined.svg" width="24" height="24">
        <img src="logo-outlined.svg" width="32" height="32">
        <img src="logo-outlined.svg" width="48" height="48">
        <img src="logo-outlined.svg" width="64" height="64">
      </div>
    </div>
  </div>

  <div>
    <h2>4. Icon (compact)</h2>
    <div class="row">
      <div class="preview light">
        <img src="logo-icon.svg" width="32" height="32">
      </div>
      <div class="preview dark">
        <img src="logo-icon.svg" width="32" height="32" style="filter: invert(1)">
      </div>
      <div class="sizes">
        <img src="logo-icon.svg" width="16" height="16">
        <img src="logo-icon.svg" width="24" height="24">
        <img src="logo-icon.svg" width="32" height="32">
      </div>
    </div>
  </div>

  <div>
    <h2>5. Original</h2>
    <div class="row">
      <div class="preview light">
        <img src="logo.svg" width="64" height="64">
      </div>
      <div class="preview dark">
        <img src="logo.svg" width="64" height="64" style="filter: invert(1)">
      </div>
    </div>
  </div>

</body>
</html>
