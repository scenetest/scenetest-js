<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outlined clapperboard style -->

  <!-- Board body outline -->
  <rect x="6" y="22" width="52" height="36" rx="2" fill="none" stroke="currentColor" stroke-width="3"/>

  <!-- Clapper top outline -->
  <path d="M6 22 L10 6 L54 6 L58 22" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>

  <!-- Stripe lines -->
  <line x1="18" y1="6" x2="14" y2="22" stroke="currentColor" stroke-width="3"/>
  <line x1="34" y1="6" x2="30" y2="22" stroke="currentColor" stroke-width="3"/>
  <line x1="50" y1="6" x2="46" y2="22" stroke="currentColor" stroke-width="3"/>

  <!-- Checkmark -->
  <polyline points="22,40 28,48 42,34" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
